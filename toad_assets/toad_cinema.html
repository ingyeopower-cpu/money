<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신비로운 황금 연못의 두꺼비 - 시네마틱 모션 스튜디오</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080f0b;
      --card-bg: rgba(18, 28, 22, 0.75);
      --card-border: rgba(110, 231, 183, 0.2);
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --accent-gold-light: #fde68a;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #122319 0%, #060b08 100%);
      color: var(--text-main);
      font-family: 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px;
    }

    /* 헤더 */
    header {
      text-align: center;
      margin-bottom: 20px;
      animation: fadeInDown 0.8s ease-out;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 999px;
      font-size: 0.85rem;
      color: #6ee7b7;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseDot 1.5s infinite alternate;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a7f3d0 0%, #fde68a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* 시네마틱 프레임 컨테이너 */
    .cinema-viewport {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                  0 0 40px rgba(16, 185, 129, 0.2);
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease;
    }

    .cinema-viewport:hover {
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.85),
                  0 0 50px rgba(16, 185, 129, 0.35);
    }

    /* 시네마틱 레터박스 바 */
    .letterbox-bar {
      position: absolute;
      left: 0;
      width: 100%;
      height: 0;
      background: #000;
      z-index: 20;
      transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .letterbox-top { top: 0; }
    .letterbox-bottom { bottom: 0; }
    .cinema-viewport.scope-active .letterbox-bar {
      height: 6.5%;
    }

    /* 캔버스 및 레이어 */
    #animationCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.1s ease-out;
    }

    /* 점프 애니메이션 클래스 */
    .jumping {
      animation: frogLeap 0.95s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
    }

    @keyframes frogLeap {
      0% {
        transform: scale(1, 1) translateY(0);
      }
      20% {
        transform: scale(1.12, 0.85) translateY(15px); /* 도약 준비 웅크리기 */
      }
      50% {
        transform: scale(0.9, 1.15) translateY(-90px); /* 공중 도약 정점 */
      }
      75% {
        transform: scale(1.05, 0.95) translateY(-10px);
      }
      90% {
        transform: scale(0.98, 1.02) translateY(5px);
      }
      100% {
        transform: scale(1, 1) translateY(0);
      }
    }

    /* 클릭 힌트 오버레이 */
    .click-hint {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: #fde68a;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 25;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }

    /* 컨트롤 바 */
    .control-panel {
      width: 100%;
      max-width: 960px;
      margin-top: 18px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 9px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      border: none;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }

    .btn-gold {
      background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
      border: none;
      color: #1a1001;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }

    .btn-gold:hover {
      background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
    }

    /* 다운로드 셀렉터 */
    .download-group {
      display: flex;
      gap: 8px;
    }

    .download-link {
      text-decoration: none;
      font-size: 0.82rem;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #d1d5db;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .download-link:hover {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #6ee7b7;
    }

    /* 키프레임 애니메이션 */
    @keyframes pulseDot {
      from { transform: scale(0.85); opacity: 0.7; }
      to { transform: scale(1.2); opacity: 1; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 반응형 */
    @media (max-width: 768px) {
      h1 { font-size: 1.6rem; }
      .control-panel {
        flex-direction: column;
        align-items: stretch;
      }
      .control-group, .download-group {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">
      <span class="badge-dot"></span>
      <span>4K 애니메이션 시네마 스튜디오</span>
    </div>
    <h1>신비로운 황금 연못의 두꺼비</h1>
    <p class="subtitle">화면을 클릭하면 두꺼비가 연잎에서 펄쩍 뛰어오릅니다!</p>
  </header>

  <!-- 메인 시네마 뷰포트 -->
  <div class="cinema-viewport" id="viewport">
    <div class="letterbox-bar letterbox-top"></div>
    <div class="letterbox-bar letterbox-bottom"></div>
    
    <canvas id="animationCanvas"></canvas>

    <div class="click-hint">
      <span>👆 화면을 클릭해 점프시키기</span>
    </div>
  </div>

  <!-- 컨트롤 패널 -->
  <div class="control-panel">
    <div class="control-group">
      <button class="btn btn-primary" id="btnPlayPause">
        <span id="playIcon">⏸</span> <span id="playText">일시정지</span>
      </button>
      <button class="btn" id="btnJump">
        <span>🐸</span> 점프하기!
      </button>
      <button class="btn btn-gold" id="btnCoinShower">
        <span>💰</span> 황금비 내리기
      </button>
      <button class="btn" id="btnCinemaScope">
        <span>🎬</span> 영화 비율
      </button>
      <button class="btn" id="btnSound">
        <span id="soundIcon">🔊</span> 자연의 소리
      </button>
    </div>

    <!-- 파일 다운로드 링크 -->
    <div class="download-group">
      <a href="animated_toad.webp" download="animated_toad.webp" class="download-link">
        📥 WebP 영상 다운로드
      </a>
      <a href="animated_toad.gif" download="animated_toad.gif" class="download-link">
        📥 GIF 짤방 다운로드
      </a>
      <a href="toad_base.jpg" download="toad_original_4k.jpg" class="download-link">
        🖼️ 원본 4K 이미지
      </a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('animationCanvas');
    const ctx = canvas.getContext('2d');
    const viewport = document.getElementById('viewport');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');
    const btnJump = document.getElementById('btnJump');
    const btnCoinShower = document.getElementById('btnCoinShower');
    const btnCinemaScope = document.getElementById('btnCinemaScope');
    const btnSound = document.getElementById('btnSound');

    // 기본 이미지 로드
    const baseImg = new Image();
    baseImg.src = 'toad_base.jpg';

    let isPlaying = true;
    let animFrameId = null;
    let time = 0;
    let isJumping = false;
    let audioCtx = null;
    let soundEnabled = false;

    // 패럴랙스 마우스 좌표
    let mouseX = 0, mouseY = 0;
    let targetX = 0, targetY = 0;

    // 파티클 (빛가루 / 반딧불이)
    const particles = [];
    const coins = [];

    function initParticles() {
      particles.length = 0;
      for (let i = 0; i < 45; i++) {
        particles.push({
          x: Math.random() * 1376,
          y: Math.random() * 768,
          vx: (Math.random() - 0.5) * 0.6,
          vy: -Math.random() * 0.8 - 0.2,
          size: Math.random() * 4.5 + 1.5,
          color: Math.random() > 0.4 ? 'rgba(253, 230, 138, ' : 'rgba(167, 243, 208, ',
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    baseImg.onload = () => {
      canvas.width = baseImg.naturalWidth || 1376;
      canvas.height = baseImg.naturalHeight || 768;
      initParticles();
      requestAnimationFrame(renderLoop);
    };

    // 렌더링 루프
    function renderLoop(timestamp) {
      if (isPlaying) {
        time += 0.028; // 프레임 진행
      }

      // 부드러운 패럴랙스 보간
      targetX += (mouseX - targetX) * 0.05;
      targetY += (mouseY - targetY) * 0.05;

      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      // 1. 기본 배경 및 연못 그리기 (패럴랙스 미세 틸트)
      ctx.save();
      ctx.translate(targetX * 8, targetY * 6);
      ctx.drawImage(baseImg, 0, 0, w, h);
      ctx.restore();

      // 2. 두꺼비 부위 호흡 애니메이션 (가슴, 턱, 배 호흡 팽창)
      // 두꺼비 좌표: x: 670, y: 410, w: 500, h: 420
      const toadX = 420;
      const toadY = 200;
      const toadW = 500;
      const toadH = 430;

      const breathScale = 1.0 + Math.sin(time) * 0.02; // 호흡 2% 수축팽창
      const breathSwayY = Math.sin(time) * 2.5;

      ctx.save();
      // 연잎과 접한 발 밑을 앵커 포인트로 호흡
      const anchorX = 670 + targetX * 15;
      const anchorY = 560 + targetY * 12;

      ctx.translate(anchorX, anchorY + breathSwayY);
      ctx.scale(1.0 + Math.sin(time) * 0.012, breathScale);
      ctx.translate(-anchorX, -anchorY);

      // 클리핑 경로: 두꺼비 본체 부드러운 타원 영역 추출 및 오버레이
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(670, 410, 240, 210, 0, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(baseImg, targetX * 15, targetY * 12 + breathSwayY, w, h);
      ctx.restore();

      // 3. 주기적 눈 깜빡임 (약 4초마다 1번씩 깜빡)
      const blinkCycle = (time * 0.45) % (Math.PI * 2);
      if (blinkCycle > 5.9 || blinkCycle < 0.2) {
        // 눈 감는 정도 (0 ~ 1)
        const progress = Math.sin((blinkCycle > 5.9 ? (blinkCycle - 5.9) / 0.38 : (blinkCycle + 0.38) / 0.76) * Math.PI);
        drawEyelids(progress);
      }

      ctx.restore();

      // 4. 연못 수면 빛 반사 쉬머 효과
      ctx.save();
      for (let i = 0; i < 14; i++) {
        const px = 150 + i * 85 + Math.sin(time + i) * 25;
        const py = 520 + (i % 5) * 40 + Math.cos(time + i * 0.7) * 15;
        const pr = 20 + Math.sin(time * 1.5 + i) * 10;
        const grad = ctx.createRadialGradient(px, py, 0, px, py, pr);
        grad.addColorStop(0, 'rgba(255, 255, 210, 0.4)');
        grad.addColorStop(1, 'rgba(255, 255, 210, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(px, py, pr * 2, pr * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // 5. 공중에 떠다니는 반딧불이 & 빛가루 렌더링
      ctx.save();
      particles.forEach(p => {
        p.x += p.vx + Math.sin(time + p.phase) * 0.3;
        p.y += p.vy + Math.cos(time + p.phase) * 0.2;

        if (p.x < 0) p.x = w;
        if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h;

        const pulse = (Math.sin(time * 2 + p.phase) + 1) / 2;
        const curSize = p.size * (0.8 + 0.4 * pulse);

        // 외부 은은한 광채
        ctx.beginPath();
        ctx.arc(p.x, p.y, curSize * 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color + (0.18 * pulse) + ')';
        ctx.fill();

        // 중심 하이라이트 코어
        ctx.beginPath();
        ctx.arc(p.x, p.y, curSize, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.7 + 0.3 * pulse) + ')';
        ctx.fill();
      });
      ctx.restore();

      // 6. 황금비 (코인 샤워) 렌더링
      if (coins.length > 0) {
        ctx.save();
        for (let i = coins.length - 1; i >= 0; i--) {
          const c = coins[i];
          c.y += c.vy;
          c.x += c.vx;
          c.rot += c.vRot;
          c.vy += 0.35; // 중력

          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rot);
          ctx.fillStyle = '#f59e0b';
          ctx.strokeStyle = '#fde68a';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.ellipse(0, 0, c.size, c.size * Math.abs(Math.cos(c.rot * 2)), 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // 엽전 구멍
          ctx.fillStyle = '#78350f';
          ctx.fillRect(-c.size * 0.25, -c.size * 0.25, c.size * 0.5, c.size * 0.5);
          ctx.restore();

          if (c.y > h + 50) coins.splice(i, 1);
        }
        ctx.restore();
      }

      animFrameId = requestAnimationFrame(renderLoop);
    }

    // 눈꺼풀 그리기 함수
    function drawEyelids(progress) {
      // 왼쪽 눈: (615, 278), r: 38
      // 오른쪽 눈: (745, 285), r: 36
      const eyes = [
        { x: 615, y: 278, r: 38 },
        { x: 745, y: 285, r: 36 }
      ];

      ctx.save();
      eyes.forEach(e => {
        const h = e.r * 2 * Math.min(1, Math.max(0, progress));
        if (h > 2) {
          ctx.fillStyle = '#8aa055';
          ctx.strokeStyle = '#586e37';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.r, 0, Math.PI, true);
          ctx.lineTo(e.x - e.r, e.y - e.r + h);
          ctx.arc(e.x, e.y - e.r + h, e.r, Math.PI, 0, false);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      });
      ctx.restore();
    }

    // 점프 액션 실행
    function triggerJump() {
      if (isJumping) return;
      isJumping = true;
      canvas.classList.add('jumping');
      playRibbitSound();

      // 물방울 파티클 폭발
      for (let i = 0; i < 25; i++) {
        particles.push({
          x: 670 + (Math.random() - 0.5) * 200,
          y: 530 + Math.random() * 30,
          vx: (Math.random() - 0.5) * 8,
          vy: -Math.random() * 7 - 3,
          size: Math.random() * 6 + 2,
          color: 'rgba(255, 255, 255, ',
          phase: Math.random() * Math.PI
        });
      }

      setTimeout(() => {
        canvas.classList.remove('jumping');
        isJumping = false;
      }, 950);
    }

    // 황금비 쏟아붓기
    function triggerCoinShower() {
      for (let i = 0; i < 60; i++) {
        setTimeout(() => {
          coins.push({
            x: Math.random() * 1376,
            y: -30,
            vx: (Math.random() - 0.5) * 3,
            vy: Math.random() * 4 + 4,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.15,
            size: Math.random() * 14 + 16
          });
        }, i * 35);
      }
      playChimeSound();
    }

    // 사운드 합성 (Web Audio API)
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playRibbitSound() {
      if (!soundEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(75, audioCtx.currentTime + 0.2);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.35);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.45);
    }

    function playChimeSound() {
      if (!soundEnabled) return;
      initAudio();
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);

        gain.gain.setValueAtTime(0.18, audioCtx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.6);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.08);
        osc.stop(audioCtx.currentTime + idx * 0.08 + 0.65);
      });
    }

    // 이벤트 리스너
    viewport.addEventListener('click', () => {
      triggerJump();
    });

    btnJump.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerJump();
    });

    btnCoinShower.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerCoinShower();
    });

    btnPlayPause.addEventListener('click', (e) => {
      e.stopPropagation();
      isPlaying = !isPlaying;
      playIcon.textContent = isPlaying ? '⏸' : '▶';
      playText.textContent = isPlaying ? '일시정지' : '재생';
    });

    btnCinemaScope.addEventListener('click', (e) => {
      e.stopPropagation();
      viewport.classList.toggle('scope-active');
      btnCinemaScope.classList.toggle('btn-primary');
    });

    btnSound.addEventListener('click', (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      if (soundEnabled) initAudio();
      btnSound.classList.toggle('btn-primary', soundEnabled);
      document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇';
    });

    // 마우스 패럴랙스 반응
    window.addEventListener('mousemove', (e) => {
      const rect = viewport.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      mouseX = (e.clientX - centerX) / (rect.width / 2);
      mouseY = (e.clientY - centerY) / (rect.height / 2);
    });
  </script>
</body>
</html>
